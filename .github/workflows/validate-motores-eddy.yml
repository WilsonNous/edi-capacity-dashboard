name: EDDY - Testes dos Motores
on:
  pull_request:
    paths:
      - 'app.py'
      - 'ednna/**'
      - 'scripts/eddy_vr01_*.py'
      - 'scripts/sync_eddy_mysql.py'
      - 'pages/Regras.py'
      - 'tests/**'
      - '.github/workflows/validate-motores-eddy.yml'
  workflow_dispatch:

jobs:
  motores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDNNA_DB_PATH: ${{ github.workspace }}/eddy-test.db
      PYTHONPATH: ${{ github.workspace }}
      EDNNA_MONITOR_EMAIL_ENABLED: "false"
      EDNNA_AUTO_EXECUTE: "false"
      EDNNA_FOLLOWUP_AUTO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Home
        run: python -m py_compile app.py
      - name: Run operational motor regression tests
        run: python -m pytest -q tests/test_motores_abertura_falta_arquivo.py tests/test_simrede_francimar_classificacao.py tests/test_retry_continuidades_pr63.py tests/test_fila_decisoes_pr64.py tests/test_auditoria_threads_pr65.py tests/test_indicadores_operacionais_pr66.py tests/test_eddy_outbox_worker.py tests/test_mysql_foundation.py tests/test_sqlite_corruption_startup.py tests/test_vr01_pilot_dispatch_safety.py tests/test_sync_eddy_mysql_direct.py
