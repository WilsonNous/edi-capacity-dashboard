name: Build and deploy Python app to Azure Web App - edi-capacity-dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: edi-capacity-dashboard-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app.py redmine_api.py

      - name: Create deployment ZIP
        run: |
          zip -r deploy.zip .             -x ".git/*"             -x ".github/*"             -x ".venv/*"             -x "venv/*"             -x "antenv/*"             -x "__pycache__/*"             -x "*.pyc"             -x "deploy.zip"

          echo "Conteúdo do pacote:"
          unzip -l deploy.zip | head -100

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AAC54350BF2045E8B833DDD34927F370 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A4D6C73FF6914FDABD78762DCEF95B2A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28FA8B0DF7BD44AA8E12086638FD46A8 }}

      - name: Deploy ZIP to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'edi-capacity-dashboard'
          slot-name: 'Production'
          package: 'deploy.zip'
