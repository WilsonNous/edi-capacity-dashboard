name: EDNNA - Validate Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ednna-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python project
        run: |
          python -m compileall app.py redmine_api.py ednna eddy_api eddy_gateway.py pages

      - name: Validate EDNNA opening miner import
        run: |
          python - <<'PY'
          from ednna.minerador_aberturas import (
              eh_abertura,
              identificar_player,
              minerar_issue,
              gerar_propostas,
              simular_proposta,
          )
          print('MINERADOR_ABERTURAS_IMPORT_OK')
          PY

      - name: Static smoke test opening miner
        run: |
          python - <<'PY'
          from ednna.minerador_aberturas import eh_abertura, identificar_player, minerar_issue

          issue = {
              'id': 999999,
              'subject': '[Itaú] Abertura de relacionamento - CLIENTE TESTE',
              'description': 'Solicitamos abertura. CNPJ 12.345.678/0001-90. Agência 1234 Conta Corrente 56789-0. contato@itau.com.br',
              'status': {'name': 'Concluído'},
              'journals': [{'notes': 'Retorno recebido e habilitação confirmada.'}],
              'attachments': [],
              'custom_fields': [],
          }
          assert eh_abertura(issue)
          assert identificar_player(issue) == 'ITAU'
          r = minerar_issue(issue)
          assert r['chamado_id'] == 999999
          assert r['sinais']['terminal_positivo'] is True
          assert any(e['codigo'] == 'EXTRAIR_DADOS' for e in r['etapas'])
          print('MINERADOR_ABERTURAS_SMOKE_OK')
          PY


      - name: Test EDDY operational motors and SIM REDE
        env:
          PYTHONPATH: ${{ github.workspace }}
          EDNNA_DB_PATH: ${{ runner.temp }}/eddy-motores-test.db
          EDNNA_MONITOR_EMAIL_ENABLED: "false"
          EDNNA_AUTO_EXECUTE: "false"
          EDNNA_FOLLOWUP_AUTO: "false"
        run: |
          python -m pytest -q tests/test_motores_abertura_falta_arquivo.py tests/test_simrede_francimar_classificacao.py tests/test_observabilidade_motores.py tests/test_redmine_gateway_resiliencia.py tests/test_correlacao_historico.py

      - name: Validate EDDY Intelligence Contract v1
        env:
          PYTHONPATH: ${{ github.workspace }}
          EDDY_INTELLIGENCE_TOKEN: test-secret
          EDNNA_MONITOR_EMAIL_ENABLED: "false"
        run: |
          pytest -q tests/test_intelligence_contract.py

      - name: Validate combined runtime startup and health
        env:
          PYTHONPATH: ${{ github.workspace }}
          EDDY_INTELLIGENCE_TOKEN: test-secret
          EDNNA_MONITOR_EMAIL_ENABLED: "false"
          EDNNA_AUTO_EXECUTE: "false"
          EDNNA_FOLLOWUP_AUTO: "false"
        run: |
          bash scripts/start_eddy.sh > /tmp/eddy-runtime.log 2>&1 &
          runtime_pid=$!
          cleanup() {
            kill -TERM "$runtime_pid" 2>/dev/null || true
            wait "$runtime_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          deadline = time.time() + 45
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3) as response:
                      data = json.load(response)
                      if response.status == 200 and data.get("status") == "ok":
                          print("EDDY_RUNTIME_HEALTH_OK", data)
                          break
              except Exception as exc:
                  last = exc
              time.sleep(1)
          else:
              raise SystemExit(f"Runtime did not become healthy: {last}")

          req = urllib.request.Request(
              "http://127.0.0.1:8000/api/intelligence/handshake",
              headers={
                  "Authorization": "Bearer test-secret",
                  "X-EDNNA-Contract-Version": "1",
              },
          )
          with urllib.request.urlopen(req, timeout=5) as response:
              data = json.load(response)
              assert response.status == 200
              assert data["specialist_id"] == "eddy"
              assert data["contract_version"] == "1"
          print("EDDY_GATEWAY_API_OK")
          PY

          curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null
          echo "EDDY_GATEWAY_STREAMLIT_HTTP_OK"

          python - <<'PY'
          import concurrent.futures
          import urllib.request

          urls = [
              "http://127.0.0.1:8000/",
              "http://127.0.0.1:8000/_stcore/health",
          ] * 20

          def fetch(url):
              with urllib.request.urlopen(url, timeout=8) as response:
                  body = response.read()
                  return response.status, len(body)

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              results = list(pool.map(fetch, urls))
          assert all(status == 200 for status, _ in results), results
          print("EDDY_GATEWAY_CONCURRENT_HTTP_OK", len(results))
          PY

      - name: Report repository hygiene debt
        run: |
          tracked=$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' | wc -l || true)
          echo "TRACKED_PYTHON_CACHE_FILES=$tracked"
          echo "Informativo nesta versão: limpeza do legado de caches será tratada separadamente para não misturar escopo com o motor de aberturas."
