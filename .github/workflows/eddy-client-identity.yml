name: EDDY Client Identity Regression

on:
  pull_request:
    paths:
      - "ednna/eddy_client_identity.py"
      - "ednna/eddy_client_identity_store.py"
      - "ednna/eddy_blueprint_mysql_evidence.py"
      - "scripts/eddy_identity_mysql_refresh.py"
      - "scripts/start_eddy.sh"
      - "ednna/eddy_vr01_portfolio_cycle.py"
      - "tests/test_eddy_client_identity*.py"
      - ".github/workflows/eddy-client-identity.yml"
  push:
    branches: [main]
    paths:
      - "ednna/eddy_client_identity.py"
      - "ednna/eddy_client_identity_store.py"
      - "ednna/eddy_vr01_portfolio_cycle.py"
      - "tests/test_eddy_client_identity*.py"
      - ".github/workflows/eddy-client-identity.yml"

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pymysql requests openpyxl xlrd
      - name: Compile identity modules
        run: python -m py_compile ednna/eddy_client_identity.py ednna/eddy_client_identity_store.py ednna/eddy_blueprint_mysql_evidence.py ednna/eddy_vr01_portfolio_cycle.py scripts/eddy_identity_mysql_refresh.py
      - name: Run identity regressions
        run: python -m pytest -q tests/test_eddy_client_identity.py tests/test_eddy_client_identity_cache.py
