name: EDDY - VR01 Homologation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  vr01-homologation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_eddy_vr01_homologation.py -v
