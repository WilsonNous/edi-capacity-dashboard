name: EDDY - SQLite Diagnostic Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  sqlite-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_eddy_sqlite_diagnostic.py -v
      - run: bash -n scripts/start_eddy.sh
